<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 12px; }
.col-card { background: white; border-radius: 6px; padding: 12px; }
.col-title {
    display:flex; align-items:center; gap:5px;
    flex-wrap:nowrap; padding-bottom:6px;
    border-bottom:2px solid #e0e8f0; margin-bottom:8px;
    font-size:12px; font-weight:bold; color:#1a4a7a;
}
.btn-ico {
    width:22px; height:22px; border-radius:3px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    padding:0; font-size:13px; flex-shrink:0;
    background:#f8f8f8; border:1px solid #27ae60;
}
</style>
</head>
<body>
<div class="col-card">
    <div class="col-title">
        🩺 Test
        <button type="button" class="btn-ico" onclick="alert('CLIQUE OK')">✅</button>
        <button type="button" class="btn-ico" onclick="alert('ANORMAL OK')">✏️</button>
    </div>
    <p>Texte sous le titre</p>
</div>
</body>
</html>
